databaseChangeLog:
  - changeSet:
      id: create-transfers
      author: B1pka
      changes:
        - createSequence:
            sequenceName: transfers_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: from_card_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: to_card_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: numeric(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addDefaultValue:
            tableName: transfers
            columnName: id
            defaultValueSequenceNext: transfers_seq

        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: from_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transfers_from_card

        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: to_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transfers_to_card